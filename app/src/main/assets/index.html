<!doctype html><html lang="tr"><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta charset="utf-8"><meta name="theme-color" content="#081b2d"><title>Edirne Hava Durumu</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#061524;color:#fff}.top{padding:22px 17px 16px;background:linear-gradient(155deg,#11679b,#08233a 65%,#061524);position:sticky;top:0;z-index:5}.brand{font-weight:800;font-size:25px}.sub{font-size:13px;color:#c5e7fa;margin-top:4px}.refresh{float:right;border:0;border-radius:12px;padding:9px 12px;background:#ffffff20;color:#fff;font-weight:700}.wrap{padding:13px}.card{background:#0d273c;border:1px solid #ffffff0d;border-radius:19px;padding:15px;margin-bottom:12px;box-shadow:0 7px 20px #0004}.hero{display:flex;justify-content:space-between;align-items:center}.place{color:#9edcff;font-size:14px}.temp{font-size:60px;font-weight:800;line-height:1}.desc{font-size:19px;margin:6px 0;color:#e7f7ff}.feels{color:#b8ccda;font-size:13px}.bigicon{font-size:62px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.stat{background:#081e31;border-radius:14px;padding:12px}.stat small{color:#9bb5c6}.stat b{display:block;font-size:19px;margin-top:5px}.section-title{margin:2px 0 12px;font-size:17px}.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:3px}.day{min-width:82px;background:#081e31;border-radius:14px;padding:11px 7px;text-align:center}.day .date{font-size:12px;color:#a9c5d7}.day .ico{font-size:25px;margin:7px 0}.day b{font-size:17px}.day span{font-size:13px;color:#9fb2c1}.hours{display:flex;gap:8px;overflow-x:auto}.hour{min-width:68px;text-align:center;background:#081e31;border-radius:13px;padding:9px 5px}.hour small{color:#a9c0ce}.hour div{font-size:23px;margin:5px 0}.hour b{font-size:15px}.districts{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.dist{border:0;border-radius:11px;padding:11px 4px;background:#123750;color:#fff;font-size:12px}.dist.active{background:#1676b5}.warn{background:#503a08;border-color:#a97815;color:#ffe6a4}.warn b{display:block;margin-bottom:5px}.btns{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.btn{padding:13px;border-radius:12px;background:#1268a0;color:#fff;text-decoration:none;text-align:center;font-weight:700;font-size:13px}.meta{display:flex;justify-content:space-between;color:#a9c1d0;font-size:12px}.foot{text-align:center;padding:20px 10px 28px;color:#91aabb;font-size:12px}.loading{color:#a9ddff}.error{color:#ffd1d1}::-webkit-scrollbar{height:3px;width:3px}::-webkit-scrollbar-thumb{background:#2c607f;border-radius:5px}</style></head><body><div class="top"><img id="appLogo" src="edirne_logo.png" alt="Edirne Hava Durumu" style="width:290px;height:auto;max-width:92vw;object-fit:contain;display:block;margin:0 auto 12px;border-radius:0;image-rendering:auto;"><button class="refresh" onclick="load(true)">↻ Yenile</button></div><div class="wrap"><div id="app"><div class="card loading">Güncel veriler alınıyor…</div></div><div class="card"><div class="section-title">📍 Edirne İlçeleri</div><div id="districts" class="districts"></div></div><div class="card"><div class="section-title">🔗 Hızlı Erişim</div><div class="btns"><a class="btn" href="https://www.windy.com/41.6771,26.5557,9" target="_blank">🌧️ Radar / Windy</a><a class="btn" href="https://www.instagram.com/edirnehavadurumu/" target="_blank">📸 Instagram</a><a class="btn" href="https://www.flightradar24.com/41.68,26.56/9" target="_blank">✈️ Uçuşlar</a><a class="btn" href="https://www.timeanddate.com/astronomy/night/turkey/edirne" target="_blank">🌙 Gökyüzü</a></div></div></div><div class="foot">/ edirnehavadurumu<br><b>Takipte kal, havadan haberdar ol!</b><br><span>Uygulama v2.0</span></div><script>
const places={"Edirne Merkez":[41.6771,26.5557],"Keşan":[40.8558,26.6300],"Enez":[40.7247,26.0820],"İpsala":[40.9211,26.3827],"Uzunköprü":[41.2651,26.6885],"Meriç":[41.1912,26.4208],"Havsa":[41.5481,26.8225],"Süloğlu":[41.7658,26.9280],"Lalapaşa":[41.8397,26.7358]};let selected="Edirne Merkez";
const icons={0:"☀️",1:"🌤️",2:"⛅",3:"☁️",45:"🌫️",48:"🌫️",51:"🌦️",53:"🌦️",55:"🌧️",61:"🌦️",63:"🌧️",65:"🌧️",71:"🌨️",73:"❄️",75:"❄️",80:"🌦️",81:"🌧️",82:"⛈️",95:"⛈️",96:"⛈️",99:"⛈️"};const texts={0:"Açık",1:"Çoğunlukla açık",2:"Parçalı bulutlu",3:"Kapalı",45:"Sis",48:"Puslu sis",51:"Hafif çisenti",53:"Çisenti",55:"Kuvvetli çisenti",61:"Hafif yağmur",63:"Yağmur",65:"Kuvvetli yağmur",71:"Hafif kar",73:"Kar",75:"Kuvvetli kar",80:"Sağanak",81:"Sağanak",82:"Kuvvetli sağanak",95:"Gök gürültülü",96:"Gök gürültülü",99:"Kuvvetli gök gürültülü"};
function icon(c){return icons[c]||"🌡️"}function txt(c){return texts[c]||"Değişken"}function fmtDay(s){return new Date(s+"T12:00:00").toLocaleDateString("tr-TR",{weekday:"short",day:"numeric",month:"short"})}function fmtHour(s){return s.slice(11,16)}
function alertBox(c){if([82,95,96,99].includes(c))return '<div class="card warn"><b>⚠️ Dikkat</b>Gök gürültülü veya kuvvetli sağanak ihtimali bulunuyor. Güncel resmi uyarıları ayrıca takip edin.</div>';if([65,75].includes(c))return '<div class="card warn"><b>⚠️ Dikkat</b>Kuvvetli yağış/kar koşulları görülebilir. Ulaşımda dikkatli olun.</div>';return ""}
function render(d){const c=d.current,dy=d.daily,h=d.hourly;let days="",hrs="";for(let i=0;i<7;i++)days+=`<div class="day"><div class="date">${fmtDay(dy.time[i])}</div><div class="ico">${icon(dy.weather_code[i])}</div><b>${Math.round(dy.temperature_2m_max[i])}°</b> <span>/ ${Math.round(dy.temperature_2m_min[i])}°</span></div>`;const now=new Date(),start=Math.max(0,h.time.findIndex(x=>new Date(x)>=now));for(let j=start;j<Math.min(start+18,h.time.length);j++)hrs+=`<div class="hour"><small>${fmtHour(h.time[j])}</small><div>${icon(h.weather_code[j])}</div><b>${Math.round(h.temperature_2m[j])}°</b><small>💧${Math.round(h.precipitation_probability[j])}%</small></div>`;document.getElementById("app").innerHTML=`<div class="card"><div class="hero"><div><div class="place">📍 ${selected}</div><div class="temp">${Math.round(c.temperature_2m)}°</div><div class="desc">${icon(c.weather_code)} ${txt(c.weather_code)}</div><div class="feels">Hissedilen ${Math.round(c.apparent_temperature)}°</div></div><div class="bigicon">${c.is_day?"☀️":"🌙"}</div></div></div>${alertBox(c.weather_code)}<div class="card grid"><div class="stat"><small>💧 Nem</small><b>%${c.relative_humidity_2m}</b></div><div class="stat"><small>💨 Rüzgâr</small><b>${Math.round(c.wind_speed_10m)} km/sa</b></div><div class="stat"><small>🌧️ Yağış</small><b>%${Math.round(c.precipitation_probability||0)}</b></div><div class="stat"><small>🧭 Yön</small><b>${Math.round(c.wind_direction_10m)}°</b></div></div><div class="card"><div class="section-title">🕐 Saatlik Tahmin</div><div class="hours">${hrs}</div></div><div class="card"><div class="section-title">📅 7 Günlük Tahmin</div><div class="days">${days}</div></div><div class="card"><div class="meta"><span>🌅 ${dy.sunrise[0].slice(11,16)}</span><span>🌇 ${dy.sunset[0].slice(11,16)}</span><span>Güncel</span></div></div>`}
function drawDistricts(){let el=document.getElementById("districts");el.innerHTML="";Object.keys(places).forEach(n=>{let b=document.createElement("button");b.className="dist"+(n===selected?" active":"");b.textContent=n;b.onclick=()=>{selected=n;drawDistricts();load()};el.appendChild(b)})}
async function load(){const [lat,lon]=places[selected],a=document.getElementById("app");a.innerHTML='<div class="card loading">☁️ '+selected+' için güncel veriler alınıyor…</div>';try{const u=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,weather_code,wind_speed_10m,wind_direction_10m,precipitation_probability&hourly=temperature_2m,weather_code,precipitation_probability&daily=weather_code,temperature_2m_max,temperature_2m_min,wind_speed_10m_max,sunrise,sunset&timezone=Europe%2FIstanbul&forecast_days=7`;const d=await(await fetch(u)).json();render(d)}catch(e){a.innerHTML='<div class="card error">❌ Veriler alınamadı. İnternet bağlantısını kontrol edip tekrar deneyin.</div>'}}
drawDistricts();load();
</script></body></html>
